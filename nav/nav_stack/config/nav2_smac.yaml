local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 5.0
      rolling_window: true
      width: 15
      height: 15
      resolution: 0.05
      always_send_full_costmap: true
      track_unknown_space: false

      footprint: "[ [0.5, 0.46], [0.5, -0.46], [-0.5, -0.46], [-0.5, 0.46] ]"
      footprint_padding: 0.08

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: laser_scan_sensor

        laser_scan_sensor:
          sensor_frame: bottom_lidar_link
          data_type: LaserScan
          topic: /scan_modified
          marking: true
          clearing: true
          inf_is_valid: true
          expected_update_rate: 0.0
          min_obstacle_height: 0.05
          max_obstacle_height: 10.0
          obstacle_min_range: 0.5
          obstacle_max_range: 2.5
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.85
        cost_scaling_factor: 2.0


global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 5.0
      rolling_window: true                 # FIXED: Changed from true to false for static map use
      width: 300
      height: 300
      always_send_full_costmap: false
      trinary_costmap: true
      use_maximum: false
      lethal_cost_threshold: 100
      unknown_cost_value: 255
      track_unknown_space: false

      footprint: "[ [0.5, 0.46], [0.5, -0.46], [-0.5, -0.46], [-0.5, 0.46] ]"
      footprint_padding: 0.08

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer" # FIXED: Added missing plugin definition string
        enabled: true
        map_topic: /map
        subscribe_to_updates: true
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer" # FIXED: Added missing plugin definition string
        enabled: true
        track_unknown_space: true
        observation_sources: laser_scan_sensor

        laser_scan_sensor:
          min_obstacle_height: 0.05
          max_obstacle_height: 10.0
          sensor_frame: bottom_lidar_link
          data_type: LaserScan
          topic: /scan_modified
          marking: true
          clearing: true
          inf_is_valid: true
          expected_update_rate: 5.0
          obstacle_min_range: 0.5
          obstacle_max_range: 2.5
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer" # FIXED: Added missing plugin definition string
        enabled: true
        inflation_radius: 0.85
        cost_scaling_factor: 2.0


behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"        # FIXED: Changed from :: to /
      max_rotational_vel: 0.4
      min_rotational_vel: 0.1
      rotational_acc_lim: 0.5
    backup:
      plugin: "nav2_behaviors/BackUp"      # FIXED: Changed from :: to /
    wait:
      plugin: "nav2_behaviors/Wait"        # FIXED: Changed from :: to /



planner_server: min_vel_x: -0.5
      max_vel_x: 0.5
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.5

      max_speed_xy: 1.0
      min_speed_xy: -1.0
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.3
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      use_astar: true
      motion_model_for_search: "DiffDrive"
      angle_quantization_bins: 72
      cost_travel_multiplier: 2.0


controller_server:
  ros__parameters:
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.75
      yaw_goal_tolerance: 3.14
      stateful: true                        # FIXED: Changed True to lowercase true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      min_vel_x: -0.5
      max_vel_x: 0.5
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.5

      max_speed_xy: 0.5
      min_speed_xy: -0.5

      min_speed_theta: -0.5

      acc_lim_x: 0.1
      acc_lim_y: 0.0
      acc_lim_theta: 0.1

      decel_lim_x: -0.5
      decel_lim_theta: -0.5

      xy_goal_tolerance: 0.75
      yaw_goal_tolerance: 3.14

      sim_time: 3.5                         # OPTIMIZED: Dropped from 5.0 to 3.5. DWB lookahead at 1m/s for 5 full seconds looks 5 meters out! That causes late evasion. 

      vx_samples: 15                        # OPTIMIZED: Increased slightly from 10 to give cleaner arc trajectories around the obstacle
      vtheta_samples: 15

      critics: ["GoalAlign", "PathAlign", "ObstacleFootprint"]
      PathAlign.scale: 12.0                 # OPTIMIZED: Dropped from 20.0 so the local planner is willing to move off-path to dodge the obstacle
      GoalAlign.scale: 14.0                 # OPTIMIZED: Dropped from 25.0
      ObstacleFootprint.scale: 1.5          # OPTIMIZED: Boosted significantly from 0.1 so it fears hitting the obstacle much more than straying off-path
      PathAlign.forward_point_distance: 0.325
      GoalAlign.forward_point_distance: 0.325


