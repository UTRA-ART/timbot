local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 15
      height: 15
      resolution: 0.05  # Nav2 usually needs this defined explicitly
      always_send_full_costmap: true
      track_unknown_space: false

      footprint: "[ [0.5, 0.46], [0.5, -0.46], [-0.5, -0.46], [-0.5, 0.46] ]"
      footprint_padding: 0.2

      # Plugin definitions (note the new plugin syntax)
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: laser_scan_sensor

        laser_scan_sensor:
          sensor_frame: bottom_lidar_link
          data_type: LaserScan
          topic: /scan_modified
          marking: true
          clearing: true
          inf_is_valid: true
          expected_update_rate: 0.0
          min_obstacle_height: 0.05
          max_obstacle_height: 10.0
          obstacle_min_range: 0.5
          obstacle_max_range: 2.5
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.1
        cost_scaling_factor: 1.0
      

# Global path planning

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map            # Map frame for global costmap
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true # should look into this, and why it is not working
      always_send_full_costmap: false
      width: 100
      height: 100
      trinary_costmap: true
      use_maximum: false
      lethal_cost_threshold: 100
      unknown_cost_value: 255 # lets see what happens with this
      track_unknown_space: false 

      
      # resolution: 0.02   # Optional, set if not defined elsewhere

      footprint: "[ [0.5, 0.46], [0.5, -0.46], [-0.5, -0.46], [-0.5, 0.46] ]"
      footprint_padding: 0.01

      # Declare which costmap layers to load
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]


      # ---- Static Layer ----
      static_layer:
        enabled: true
        map_topic: /map
        subscribe_to_updates: true
        map_subscribe_transient_local: true 

      # ---- Obstacle Layer ----
      obstacle_layer:
        enabled: true
        track_unknown_space: true
        observation_sources: laser_scan_sensor

        laser_scan_sensor:
          min_obstacle_height: 0.05
          max_obstacle_height: 10.0
          sensor_frame: bottom_lidar_link
          data_type: LaserScan
          topic: /scan_modified
          marking: true
          clearing: true
          # obstacle_range: 7.7
          # raytrace_range: 8.0
          inf_is_valid: true
          expected_update_rate: 5.0
          obstacle_min_range: 0.5
          obstacle_max_range: 2.5
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0


      # ---- Inflation Layer ----
      inflation_layer:
        enabled: true
        inflation_radius:  0.1 
        cost_scaling_factor: 1.0

# ----------------------------
# Behavior Server (recovery behaviors)
# ----------------------------
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"


planner_server:
  ros__parameters:
    planner_plugins: ['GridBased']
    GridBased:
      plugin: 'nav2_navfn_planner/NavfnPlanner'
      tolerance: 0.1
      use_astar: true
      allow_unknown: true
      use_final_approach_orientation: false
    


controller_server:
  ros__parameters:
    odom_topic: "/odometry/local"
    controller_frequency: 10.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    path_handler_plugins: ["PathHandler"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      yaw_goal_tolerance: 0.1
      xy_goal_tolerance: 0.25
      path_length_tolerance: 1.0
      stateful: true
    
    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"
      prune_distance: 0.5
      # FIX: was True with no reverse velocities allowed -> contradiction caused thrashing.
      # If you actually have reverse drive wired up, set this back to True AND make min_vel_x negative.
      enforce_path_inversion: False
      enforce_path_rotation: False
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      minimum_rotation_angle: 0.785
      reject_unit_path: False
    
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      # FIX: added GoalDist + PathDist so trajectories are scored on actually
      # closing distance to the goal/path, not just heading alignment.
      # Added Oscillation to suppressDWBLocalPlanner repeated direction flips.
      critics: ["BaseObstacle", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "RotateToGoal", "Oscillation"]

      acc_lim_x: 2.5
      acc_lim_y: 0.0

      acc_lim_theta: 3.2
      
      decel_lim_x: -2.5
      decel_lim_y: 0.0

      decel_lim_theta: -3.2
      

      # FIX: previously min_vel_x and min_speed_xy were 0.3, forcing the robot to
      # always drive forward at exactly 0.3 m/s with no ability to slow, stop, or reverse.
      # That, combined with max_vel_theta: 1.5, is the classic "drives in circles" setup.
      max_speed_xy: 0.3
      min_speed_xy: 0.0
      max_vel_x: 0.3
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_y: 0.0


      max_vel_theta: 1.5
      min_speed_theta: 0.0


      sim_time: 2.0

      vy_samples: 1
      vx_samples: 20
      vtheta_samples: 20
      xy_goal_tolerance: 0.25
      
      # FIX: raised ObstacleFootprint.scale so obstacles actually influence
      # trajectory scoring instead of being dominated 200x by alignment critics.
      PathAlign.scale: 10.0
      GoalAlign.scale: 10.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      GoalAlign.forward_point_distance: 0.8
      PathAlign.forward_point_distance: 0.8
      ObstacleFootprint.scale: 5.0
      BaseObstacle.scale: 1.0

      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: 0.5

      # min_speed_scale: 0.5
      # prefer_high_velocities: true


