global_costmap:
  ros__parameters:
    global_frame: map            # Map frame for global costmap
    robot_base_frame: base_link
    update_frequency: 5.0
    publish_frequency: 2.0
    static_map: true
    rolling_window: true
    always_send_full_costmap: false

    width: 100.0
    height: 100.0
    # resolution: 0.02   # Optional, set if not defined elsewhere

    # Declare which costmap layers to load
    plugins:
      - {name: obstacle_layer, type: "nav2_costmap_2d::ObstacleLayer"}
      - {name: inflation_layer, type: "nav2_costmap_2d::InflationLayer"}

    # ---- Obstacle Layer ----
    obstacle_layer:
      enabled: true
      track_unknown_space: true
      observation_sources: laser_scan_sensor cv_laser_scan

      laser_scan_sensor:
        min_obstacle_height: -10.0
        max_obstacle_height: 10.0
        sensor_frame: bottom_lidar_link
        data_type: LaserScan
        topic: /scan_modified
        marking: true
        clearing: true
        obstacle_range: 7.7
        raytrace_range: 8.0
        inf_is_valid: true
        expected_update_rate: 5.0

      cv_laser_scan:
        min_obstacle_height: -10.0
        max_obstacle_height: 10.0
        sensor_frame: bottom_lidar_link
        data_type: LaserScan
        topic: /cv/lane_detections_scan
        marking: true
        clearing: true
        obstacle_range: 3.7
        raytrace_range: 4.0
        inf_is_valid: true
        expected_update_rate: 20.0

      # Example PointCloud source (disabled)
      # point_cloud_sensor:
      #   min_obstacle_height: -0.1
      #   sensor_frame: zed_camera_link
      #   data_type: PointCloud2
      #   topic: zed_node/point_cloud/cloud_registered
      #   marking: true
      #   clearing: true
      #   obstacle_range: 15.0
      #   raytrace_range: 16.0

    # ---- Inflation Layer ----
    inflation_layer:
      enabled: true
      inflation_radius: 1.0
      cost_scaling_factor: 2.0
