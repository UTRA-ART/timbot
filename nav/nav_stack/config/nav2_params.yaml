# Used for local obstacle avoidance and speed generation

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 20.0
      publish_frequency: 10.0
      static_map: false
      rolling_window: true
      always_send_full_costmap: false
      width: 15
      height: 15
      resolution: 0.05  # Nav2 usually needs this defined explicitly
      always_send_full_costmap: true

      footprint: "[ [0.2, 0.15], [0.2, -0.15], [-0.2, -0.15], [-0.2, 0.15] ]"
      footprint_padding: 0.01

      # Plugin definitions (note the new plugin syntax)
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        track_unknown_space: true
        observation_sources: laser_scan_sensor cv_laser_scan

        laser_scan_sensor:
          sensor_frame: bottom_lidar_link
          data_type: LaserScan
          topic: /scan_modified
          marking: true
          clearing: true
          obstacle_range: 7.7
          raytrace_range: 8.0
          inf_is_valid: true
          expected_update_rate: 10.0
          min_obstacle_height: 0.05
          max_obstacle_height: 10.0
          obstacle_min_range: 0.5

        cv_laser_scan:
          sensor_frame: bottom_lidar_link
          data_type: LaserScan
          topic: /cv/lane_detections_scan
          marking: true
          clearing: true
          obstacle_range: 3.7
          raytrace_range: 4.0
          inf_is_valid: true
          expected_update_rate: 0.0 # Set to 0 to disable automatic timeout
          min_obstacle_height: 0.05
          max_obstacle_height: 10.0
          obstacle_min_range: 0.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

# Global path planning

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map            # Map frame for global costmap
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      static_map: true
      rolling_window: true
      always_send_full_costmap: false
      width: 100
      height: 100
      # resolution: 0.02   # Optional, set if not defined elsewhere

      footprint: "[ [0.2, 0.15], [0.2, -0.15], [-0.2, -0.15], [-0.2, 0.15] ]"
      footprint_padding: 0.01

      # Declare which costmap layers to load
      plugins:
        - {name: static_layer, type: "nav2_costmap_2d::StaticLayer"}
        - {name: obstacle_layer, type: "nav2_costmap_2d::ObstacleLayer"}
        - {name: inflation_layer, type: "nav2_costmap_2d::InflationLayer"}

      # ---- Obstacle Layer ----
      obstacle_layer:
        enabled: true
        track_unknown_space: true
        observation_sources: laser_scan_sensor cv_laser_scan

        laser_scan_sensor:
          min_obstacle_height: 0.05
          max_obstacle_height: 10.0
          obstacle_min_range: 0.5
          sensor_frame: bottom_lidar_link
          data_type: LaserScan
          topic: /scan_modified
          marking: true
          clearing: true
          obstacle_range: 7.7
          raytrace_range: 8.0
          inf_is_valid: true
          expected_update_rate: 5.0

        cv_laser_scan:
          min_obstacle_height: 0.05
          max_obstacle_height: 10.0
          obstacle_min_range: 0.5
          sensor_frame: bottom_lidar_link
          data_type: LaserScan
          topic: /cv/lane_detections_scan
          marking: true
          clearing: true
          obstacle_range: 3.7
          raytrace_range: 4.0
          inf_is_valid: true
          expected_update_rate: 0.0 # Set to 0 to disable automatic timeout

      # ---- Inflation Layer ----
      inflation_layer:
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

# ----------------------------
# Behavior Server (recovery behaviors)
# ----------------------------
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

# nav2_params.yaml - unified Nav2 parameter file (global + local costmaps, planner, controller, BT, lifecycle)
###############################################################################
# Note: adjust file paths (e.g. for the behavior tree xml) and any frame/topic
# names to match your robot. This is a direct merge of the configs you've provided,
# converted to Nav2 (ROS2) syntax.
###############################################################################

# ----------------------------
# Planner Server (global planner)
# ----------------------------
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      allow_unknown: true
      tolerance: 0.1
      use_astar: false
      use_grid_path: false
      visualize_potential: true
      cost_factor: 0.55
      neutral_cost: 66
      lethal_cost: 253

# ----------------------------
# Controller Server (local planner - DWB)
# ----------------------------
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    controller_plugins: ["FollowPath"]
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    current_goal_checker: "general_goal_checker"

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.14

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1 # Meters
      movement_time_allowance: 30.0 # Seconds to move that radius

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      prune_plan: true
      transform_tolerance: 1.0
      short_circuit_trajectory_evaluation: false
      
      # Trajectory generator - REQUIRED for generating velocity samples
      trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"
      
      # Debug - publish evaluated trajectories
      publish_evaluation: true
      publish_cost_grid_pc: true

      # Robot kinematic / dynamic limits
      acc_lim_x: 5.0
      acc_lim_y: 0.0
      acc_lim_theta: 5.0

      max_vel_x: 2.23
      min_vel_x: -2.23
      max_vel_y: 0.0
      min_vel_y: 0.0
      max_vel_theta: 2.0
      min_vel_theta: -2.0

      # Goal tolerances
      yaw_goal_tolerance: 3.14
      xy_goal_tolerance: 0.25

      # Forward simulation
      sim_time: 2.0
      vx_samples: 30
      vtheta_samples: 40
      vy_samples: 1

      # Scoring biases
      path_distance_bias: 20.0
      goal_distance_bias: 20.0
      occdist_scale: 0.02

      # DWB critics - order matters! RotateToGoal should be LAST (only for final pose alignment)
      critics: ["Oscillation", "BaseObstacle", "PathAlign", "PathDist", "GoalAlign", "GoalDist", "RotateToGoal"]

      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.5
      PathDist.scale: 32.0
      GoalAlign.scale: 5.0
      GoalAlign.forward_point_distance: 0.5
      GoalDist.scale: 24.0
      BaseObstacle.scale: 0.02
      RotateToGoal.scale: 10.0
      RotateToGoal.slowing_factor: 0.3
      Oscillation.scale: 1.0


# ----------------------------
# Behavior Tree Navigator (minimal params)
# ----------------------------
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    bt_loop_duration: 10
    default_server_timeout: 20
    # These are the default Nav2 behavior tree plugins
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
