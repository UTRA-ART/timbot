# ----------------------------
# Lifecycle Manager
# ----------------------------
lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator", "global_costmap", "local_costmap"]

