local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 5.0
      rolling_window: true
      width: 15
      height: 15
      resolution: 0.05  # Nav2 usually needs this defined explicitly
      always_send_full_costmap: true
      track_unknown_space: false

      footprint: "[ [0.5, 0.46], [0.5, -0.46], [-0.5, -0.46], [-0.5, 0.46] ]"
      footprint_padding: 0.10

      # Plugin definitions (note the new plugin syntax)
      plugins: ["obstacle_layer", "inflation_layer", "lane_layer_cv", "lane_inflation_layer_cv", "obstacle_layer_cv", "obstacle_inflation_layer_cv"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: false
        observation_sources: laser_scan_sensor

        laser_scan_sensor:
          sensor_frame: bottom_lidar_link
          data_type: LaserScan
          topic: /scan_modified
          marking: true
          clearing: true
          inf_is_valid: true
          expected_update_rate: 5.0
          min_obstacle_height: 0.05
          max_obstacle_height: 10.0
          obstacle_min_range: 0.1
          obstacle_max_range: 4.0
          raytrace_min_range: 0.0
          raytrace_max_range: 5.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: false
        inflation_radius: 0.7
        cost_scaling_factor: 10.0

      lane_layer_cv:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: cv_lanes
        
        cv_lanes:
          sensor_frame: left_camera_link_optical
          data_type: PointCloud2
          topic: /cv/lane_detections_cloud
          marking: true
          clearing: true
          inf_is_valid: true
          expected_update_rate: 0.0 # Set to 0 to disable automatic timeout
          min_obstacle_height: -0.05
          max_obstacle_height: 0.05
          obstacle_min_range: 0.05
          obstacle_max_range: 2.5
          raytrace_min_range: 0.0 # won't be used bc clearing set to false but leaving anyway
          raytrace_max_range: 3.0 # won't be used bc clearing set to false but leaving anyway

      lane_inflation_layer_cv:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius:  0.3 
        cost_scaling_factor: 1.0

      obstacle_layer_cv:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Dual source: cv_marking puts down obstacles (uses filtered clusters),
        # cv_clearing casts rays through free space (uses raw depth ROI cloud).
        # This is what lets a person who walks away actually get CLEARED — the
        # depth cloud has points throughout free space so raytracing reaches
        # cells where the person was previously marked.
        observation_sources: cv_marking cv_clearing

        cv_marking:
          observation_persistence: 2.0
          sensor_frame: left_camera_link_optical
          data_type: PointCloud2
          topic: /zed_node/left/obstacle_points
          marking: true
          clearing: true
          inf_is_valid: true
          expected_update_rate: 0.0
          min_obstacle_height: 0.05
          max_obstacle_height: 10.0
          obstacle_min_range: 0.05
          obstacle_max_range: 4.0

        cv_clearing:
          observation_persistence: 1.0
          sensor_frame: left_camera_link_optical
          data_type: PointCloud2
          topic: /zed_node/left/depth_points
          marking: false
          clearing: true
          inf_is_valid: true
          expected_update_rate: 0.0
          min_obstacle_height: 0.05
          max_obstacle_height: 10.0
          raytrace_min_range: 0.0
          raytrace_max_range: 5.0
          observation_persistence: 0.5

      obstacle_inflation_layer_cv:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius:  0.3 
        cost_scaling_factor: 1.0

# Global path planning

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map            # Map frame for global costmap
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 5.0
      rolling_window: false
      always_send_full_costmap: false
      width: 200
      height: 200
      origin_x: -100.0
      origin_y: -100.0
      trinary_costmap: true
      use_maximum: false
      lethal_cost_threshold: 100
      unknown_cost_value: 255 # lets see what happens with this
      track_unknown_space: true 

      
      resolution: 0.05   # Optional, set if not defined elsewhere

      footprint: "[ [0.8019, 0.3754], [0.8019, -0.3754], [-0.6070, -0.3754], [-0.6070, 0.3754] ]"
      footprint_padding: 0.08

      # Declare which costmap layers to load
      plugins: ["obstacle_layer", "inflation_layer", "lane_obstacle_layer", "lane_inflation_layer", "cv_obstacles", "cv_obstacles_inflation_layer" ]

      # ---- Obstacle Layer ----Forward
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: false
        track_unknown_space: true
        observation_sources: laser_scan_sensor

        laser_scan_sensor:
          min_obstacle_height: 0.05
          max_obstacle_height: 10.0
          sensor_frame: bottom_lidar_link
          data_type: LaserScan
          topic: /scan_modified
          marking: true
          clearing: true
          # obstacle_range: 7.7
          # raytrace_range: 8.0
          inf_is_valid: true
          expected_update_rate: 5.0
          obstacle_min_range: 0.1
          obstacle_max_range: 4.0
          raytrace_min_range: 0.0
          raytrace_max_range: 5.0

      # ---- Inflation Layer ----
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: false
        inflation_radius:  1.3
        cost_scaling_factor: 3.0

      lane_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        track_unknown_space: true
        observation_sources: lane_cv_point_cloud
        

        lane_cv_point_cloud:
          min_obstacle_height: -0.05
          max_obstacle_height: 0.05
          # obstacle_min_range: 0.5
          sensor_frame: left_camera_link_optical
          data_type: PointCloud2
          topic: /cv/lane_detections_cloud
          marking: true
          clearing: true
          # obstacle_range: 3.7
          # raytrace_range: 4.0
          inf_is_valid: true
          expected_update_rate: 0.0 # Set to 0 to disable automatic timeout
          obstacle_min_range: 0.05
          obstacle_max_range: 2.5
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0

      lane_inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer" 
        enabled: true
        inflation_radius:  1.3
        cost_scaling_factor: 3.0

      cv_obstacles:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Dual source: cv_marking puts down obstacles (uses filtered clusters),
        # cv_clearing casts rays through free space (uses raw depth ROI cloud).
        # Lets a person who walks away actually get cleared.
        observation_sources: cv_marking cv_clearing

        cv_marking:
          observation_persistence: 2.0 
          sensor_frame: left_camera_link_optical
          data_type: PointCloud2
          topic: /zed_node/left/obstacle_points
          marking: true
          clearing: true
          inf_is_valid: true
          expected_update_rate: 0.0
          min_obstacle_height: 0.05
          max_obstacle_height: 10.0
          obstacle_min_range: 0.05
          obstacle_max_range: 4.0

        cv_clearing:
          observation_persistence: 2.0
          sensor_frame: left_camera_link_optical
          data_type: PointCloud2
          topic: /zed_node/left/depth_points
          marking: false
          clearing: true
          inf_is_valid: true
          expected_update_rate: 0.0
          min_obstacle_height: 0.05
          max_obstacle_height: 10.0
          raytrace_min_range: 0.0
          raytrace_max_range: 5.0

      cv_obstacles_inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius:  1.3
        cost_scaling_factor: 3.0

# ----------------------------
# Behavior Server (recovery behaviors)
# ----------------------------
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
      max_rotational_vel: 0.3   # Match your DWB max_vel_theta
      min_rotational_vel: 0.1    # Ensure it doesn't get stuck too slow
      rotational_acc_lim: 0.1   # Match your DWB acc_lim_theta
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"


planner_server:
  ros__parameters:
    planner_plugins: ['GridBased']
    GridBased:
      plugin: 'nav2_navfn_planner/NavfnPlanner'
      tolerance: 0.5
      use_astar: true
      allow_unknown: true
      use_final_approach_orientation: false
    


controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: "odometry/local"
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.75
      yaw_goal_tolerance: 3.14
      stateful: True

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # --- Robot Velocity Limits (from DWAPlannerROS) ---
      min_vel_x: -0.7
      max_vel_x: 0.7
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.3

      # DWB equivalent of DWA's max_vel_trans / min_vel_trans
      max_speed_xy: 0.7
      min_speed_xy: -0.7

      # DWB equivalent of DWA's min_vel_theta (min rotational speed)
      min_speed_theta: -0.3

      # --- Acceleration Limits (from DWAPlannerROS, acc_lim_th -> acc_lim_theta) ---
      acc_lim_x: 0.1
      acc_lim_y: 0.0
      acc_lim_theta: 0.1

      # Deceleration limits — NOT in move_base file but critical to set explicitly.
      # Without these, Nav2 DWB defaults to using acc_lim values (10.0),
      # which means near-instantaneous stops at 2.23 m/s. These values
      # were in the original espresso_replica_in_nav2.yaml and should be kept.
      decel_lim_x: -0.7
      decel_lim_theta: -0.5

      # --- Goal Tolerance (from DWAPlannerROS) ---
      xy_goal_tolerance: 0.75
      yaw_goal_tolerance: 3.14

      # --- Forward Simulation (from DWAPlannerROS) ---
      sim_time: 2.5

      # DWA's vth_samples -> vtheta_samples in DWB
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 50
      # vy_samples omitted — robot is non-holonomic (max_vel_y: 0.0), has no effect

      # --- Trajectory Critics (mapped from DWAPlannerROS scoring params) ---
      # path_distance_bias -> PathAlign.scale
      # goal_distance_bias -> GoalAlign.scale
      # occdist_scale      -> ObstacleFootprint.scale
      # forward_point_distance is shared by both align critics
      critics: ["GoalAlign", "PathAlign", "ObstacleFootprint"]
      PathAlign.scale: 35.0
      GoalAlign.scale: 25.0
      ObstacleFootprint.scale: 0.2
      PathAlign.forward_point_distance: 0.5
      GoalAlign.forward_point_distance: 0.5

      # --- Params from move_base with NO DWB equivalent (dropped) ---
      # min_speed_scale: 0.5       -- no DWB equivalent
      # prefer_high_velocities: true -- no DWB equivalent; critic balance handles intent


