# Used for local obstacle avoidance and speed generation

local_costmap:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    update_frequency: 20.0
    publish_frequency: 10.0
    static_map: false
    rolling_window: true
    always_send_full_costmap: false
    width: 15.0
    height: 15.0
    resolution: 0.05  # Nav2 usually needs this defined explicitly

    # Plugin definitions (note the new plugin syntax)
    plugins: ["obstacle_layer", "inflation_layer"]

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      observation_sources: ["laser_scan_sensor", "cv_laser_scan"]
      enabled: true
      track_unknown_space: true

      laser_scan_sensor:
        sensor_frame: bottom_lidar_link
        data_type: LaserScan
        topic: /scan_modified
        marking: true
        clearing: true
        obstacle_range: 7.7
        raytrace_range: 8.0
        inf_is_valid: true
        expected_update_rate: 10.0
        min_obstacle_height: -10.0
        max_obstacle_height: 10.0

      cv_laser_scan:
        sensor_frame: bottom_lidar_link
        data_type: LaserScan
        topic: /cv/lane_detections_scan
        marking: true
        clearing: true
        obstacle_range: 3.7
        raytrace_range: 4.0
        inf_is_valid: true
        expected_update_rate: 20.0
        min_obstacle_height: -10.0
        max_obstacle_height: 10.0

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 1.0
      cost_scaling_factor: 2.0
