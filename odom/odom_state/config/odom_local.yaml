frequency: 50

#IMU local includes all relative odometry sensors: wheel encoders, imu, and visual odom

# Specify planar environment
two_d_mode: false

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: odom

# publish transform: world_frame --> base_link_frame
publish_tf: false

transform_time_offset: 0.05

# See /diagnostics topic for debug
print_diagnostics: true

## Odometry Sensor(s) ##

# odom0: zed_node/odom
# odom0_config: [true, true, true,
#                false, false, true,
#                false, false, false,
#                false, false, false,
#                false, false, false]
# odom0_queue_size: 10
# odom0_differential: false
# odom0_relative: false

odom0: wheel_odom/quat_synced #Use wheel_encoder data
odom0_config: [true , true , true,
               false, false, false,
               true , true , false,
               false, false, false ,
               false, false, false]
odom0_queue_size: 10
odom0_differential: false
odom0_relative: false

## IMU Sensor(s) ##

#Imu is only to use orientation vel for now, since that is the only reliable data
imu0: imu/data
imu0_config: [false, false, false,
              true , true , false ,
              false, false, false,
              true , true , true ,
              true , true , true]
imu0_queue_size: 5
imu0_differential: false
imu0_relative: false
imu0_remove_gravitational_acceleration: true

imu0_linear_acceleration_noise: 0.5
imu0_angular_velocity_noise: 0.2
imu0_linear_acceleration_bias: 0.1
imu0_angular_velocity_bias: 0.1

#feed velocity commands

# twist0: /key_vel
# twist0_config: [false, false, false,
#                 false, false, false,
#                 true,  false, false,
#                 false, false, true,
#                 false, false, false]
# twist0_queue_size: 10
# twist0_relative: false