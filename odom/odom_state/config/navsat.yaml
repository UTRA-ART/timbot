/**:
  ros__parameters:
    frequency: 5.0
    delay: 0.0
    
    # Use the first GPS fix to set origin if datum fails
    wait_for_datum: false 
    datum: [0.0, 0.0, 0.0]
    zero_altitude: true
    
    # CRITICAL: This determines the TF direction
    broadcast_cartesian_transform: true 
      # If true, broadcast cartesian transform as parent frame of MAP (UTM→MAP).
    # Usually, we want UTM as the parent of MAP
    broadcast_cartesian_transform_as_parent_frame: true
    
    # Frames
    publish_filtered_gps: true
    world_frame: map
    odom_frame: odom
    base_link_frame: base_link
    sensor_frame: gps_link
    
    # Heading Setup
    yaw_offset: 1.5708  # Correct for ENU if IMU is North-facing
    use_odometry_yaw: true
    magnetic_declination_radians: -0.1306