# NavSat configuration for odom_state node
# Using GPS data to correct odometry drift

/**:
  ros__parameters:
    frequency: 5.0
    #delay: 0.0  # Simulated GPS needs no start-up time
    delay: 0.0 # Real GPS start-up time
    # world_frame: map

    # Initial configuration
    #magnetic_declination_radians: -0.1306 # toronto?
    magnetic_declination_radians: -0.1302 # Detroit
    yaw_offset: 1.5708  # pi rad since 0 yaw == east
    zero_altitude: true
    sensor_frame: gps_link

    # Publishing data
    publish_filtered_gps: true
    broadcast_cartesian_transform: true # Publishes utm → map transform
    broadcast_cartesian_transform_as_parent_frame: true
    world_frame: map
    odom_frame: odom
    base_link_frame: base_link

    # Misc
    use_odometry_yaw: true
    wait_for_datum: false
    transform_timeout: 1.0

    # debugging
    print_diagnostics: false
    debug: true