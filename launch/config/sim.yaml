# =============================================================================
# Timbot Launch Configuration — Simulation
# =============================================================================
# Usage: ros2 launch timbot_launch timbot.launch.py config:=sim.yaml
# =============================================================================

# --- Global Settings ---
sim: true
use_topic_check: true  # Set to false to use blind delay_sec instead

# --- Launch Stages (order matters) ---
# Each stage runs sequentially. If use_topic_check is true, the next stage 
# starts after the expected topics are alive. Otherwise, it waits for delay_sec.
# 
# log_level options: debug, info, warn, error (default: info)

# --- Stage 1: Gazebo Simulator ---
gazebo:
  enabled: true
  gui: true
  world_file: track.world
  log_level: error
  delay_sec: 5.0
  software_rendering: '0'
  expected_topics: []

# --- Stage 2: Spawn Robot (RSP, bridge, spawn entity) ---
spawn:
  enabled: true
  log_level: error
  x: "-19.5"
  y: "0"
  z: "0.05"
  roll: "0"
  pitch: "0"
  yaw: "1.5708"
  delay_sec: 10.0
  expected_topics:
    - /clock
    - /robot_description
    - /joint_states
    - /odom
    - /imu/data
    - /scan_lower

# --- Stage 3: Odom State (EKF local + global + navsat) ---
odom_state:
  enabled: true
  config_file: odom.yaml
  log_level: error  # Set to 'debug' to see EKF covariance internals
  delay_sec: 5.0
  position_covariance: 0.05 # cartographer pose
  orientation_covariance: 0.01 # cartographer pose
  horizontal_stddev: 5.0 # gps horizontal error - in meters
  vertical_stddev: 0.0 # gps vertical error
  wait_for_datum: false # if this is set to true, then set datum, if false, set magnetic declination radians
  datum: [0.0, 0.0, 0.0]
  magnetic_declination_radians: 0.0
  expected_topics:
    - /odometry/local

# --- Stage 4: Filter Lidar Data ---
filter_lidar:
  enabled: true
  log_level: error
  delay_sec: 2.0
  main_lidar_topic: /scan_lower
  upper_lidar_topic: /scan_upper
  out_topic: /scan_modified
  distance_to_second_lidar: 0.14
  max_theta_degrees: 20.0
  compare_lidar_time_tolerance_seconds: 2
  upper_lidar_start_index: 0
  upper_lidar_stop_index: 1080
  upper_lidar_angular_total_range: 360
  main_lidar_angular_total_range: 360
  limit_output_range: true
  desired_output_total_range: 180
  expected_topics:
    - /scan_modified

cv_pipeline:
  enabled: true
  log_level: info
  lane_detection_mode: 1  # 0 = deep learning (YOLO), 1 = classical (HSV threshold)
  camera_fps: 10

  camera_width: 640
  camera_height: 320
  white_sensitivity: 20 # Lower is stricter, higher accepts more shades of grey
  downscale_factor: 1 # 1 = full res, 2 = half res (faster processing)
  horizon_crop: 0.15 # Percentage of the top of the image to ignore (0.0 to 1.0)

  morph_size: 0 # Size of the square kernel (e.g., 3 for 3x3, 5 for 5x5)
  morph_open_iters: 0 # Number of 'Opening' passes (removes small noise)
  morph_close_iters: 0 # Number of 'Closing' passes (joins dashed lines)
  
  delay_sec: 5.0
  expected_topics:
    - /zed_node/left/image
  # Normalized coordinates [x1, y1, x2, y2, ...] defining the rover's footprint
  roi_mask_points: [0.4, 1.0, 0.5, 0.6, 0.6, 0.6, 0.7, 1.0]

# --- Stage 5: Cartographer (SLAM) ---
cartographer:
  enabled: true
  config_file: cartographer.lua
  log_level: error
  delay_sec: 5.0
  expected_topics:
    - /map

# --- Stage 6: RViz (Visualization) ---
rviz:
  enabled: true
  log_level: error
  delay_sec: 2.0
  rviz_config: timbot.rviz
  expected_topics: []

# --- Stage 7: Nav2 Stack ---
nav_stack:
  enabled: true
  config_file: nav2_rpp.yaml
  log_level: error
  delay_sec: 10.0
  expected_topics:
    - /local_costmap/costmap
    - /global_costmap/costmap

# --- Stage 8: Load Waypoints ---
load_waypoints:
  enabled: true
  config_file: sim_waypoints_fixed.json
  log_level: error
  delay_sec: 2.0
  expected_topics: []