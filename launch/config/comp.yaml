# =============================================================================
# Timbot Launch Configuration — Competition
# =============================================================================
# Usage: ros2 launch timbot_launch timbot.launch.py config:=comp.yaml
# =============================================================================

# --- Global Settings ---
sim: false
use_topic_check: true  # Set to false to use blind delay_sec instead
team_laptop: true
ramp_seg_using_lidar: false  # true = lidar publishes /ramp_seg, false = depth_detection publishes /ramp_seg

# --- Hardware Ports ---
gps_port: "/dev/gps_port_0"       # Serial port for GPS (e.g. /dev/ttyUSB0, /dev/ttyACM0)
gps_baud: 57600
lidar_lower_port: "/dev/lidar_port_0"
lidar_upper_port: "/dev/lidar_port_1"

# --- IMU NED->ENU relay ---
# Converts the AHRS orientation (NED on /imu/data_raw) to ENU on /imu/data, and
# publishes orientation in degrees on imu_ned / imu_enu for bench calibration.
imu_relay:
  yaw_offset: 0.0          # degrees, world-frame yaw calibration about ENU Up
  orientation_stddev: 0.05 # rad, orientation covariance fed to the EKF/navsat

zed_camera:
  enabled: true
  log_level: error
  delay_sec: 5.0
  video_device: "/dev/video2"
  num_disparities: 96
  block_size: 3
  p1_multiplier: 8
  p2_multiplier: 32
  expected_topics:
    - /zed_node/left/image

